[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "miragetransit"
version = "0.1.0.dev6"
description = "Deterministic transport deception simulation core"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
miragetransit = "miragetransit.cli:main"

[dependency-groups]
dev = ["ruff==0.15.6", "mypy==1.19.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
miragetransit = ["profiles/*.json", "py.typed", "dependency-lock.sha256", "web/*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

