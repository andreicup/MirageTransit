name: MirageTransit core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
      - name: Install pinned tooling
        run: python -m pip install uv==0.12.19
      - name: Install locked project
        run: uv sync --locked
      - name: Lint and format
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
      - name: Type check
        run: uv run --locked mypy src
      - name: Check packaged lock fingerprint
        run: uv run --locked python scripts/check_lock.py
      - name: Domain and CLI tests
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Build distribution
        run: uv build
      - name: Verify installed wheel outside checkout
        run: uv run --locked python scripts/check_wheel.py

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Install tooling and browser
        run: |
          python -m pip install uv==0.12.19
          uv sync --locked
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Browser acceptance on desktop and mobile
        run: npm run test:browser

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Prepare local deployment
        run: |
          python -m pip install uv==0.12.19
          uv sync --locked
          uv run --locked python deploy/prepare.py --uid "$(id -u)" --gid "$(id -g)"
      - name: Start isolated containers
        run: LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) docker compose up --build --wait --wait-timeout 120
      - name: Verify runtime and negative reachability
        run: LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) uv run --locked python scripts/check_compose.py
      - name: Cleanup
        if: always()
        run: docker compose down
